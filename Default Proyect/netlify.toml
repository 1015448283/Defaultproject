[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[dev]
  command = "npm run dev"
  functions = "netlify/functions"
  port = 3000

[functions]
  node_version = "18"
  external_node_modules = ["stripe", "@supabase/supabase-js"]

# Security & Cache Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# API & Function Proxies
[[redirects]]
  from = "/api/pagos/crear-sesion"
  to = "/.netlify/functions/create-checkout"
  status = 200

[[redirects]]
  from = "/api/pagos/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/whatsapp"
  to = "/.netlify/functions/send-whatsapp"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback rule for React Router (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200