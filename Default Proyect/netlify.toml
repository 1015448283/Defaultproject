[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  functions = "netlify/functions"

[functions]
  node_version = "18"
  external_node_modules = ["stripe", "@supabase/supabase-js", "axios"]

# Redirección para SPA (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200